<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OmniCali Real-world Extrinsics Showcase</title>
<style>
:root {
  color-scheme: light;
  --bg: #f6f8fb;
  --surface: #ffffff;
  --soft: #f2f6f9;
  --ink: #171a1f;
  --muted: #65717e;
  --line: #dce4ec;
  --line-strong: #c4ced8;
  --accent: #19748a;
  --accent-soft: #e7f4f6;
  --fail: #9b4a46;
  --shadow: rgba(18, 28, 38, 0.10);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  letter-spacing: 0;
}
button, select, input { font: inherit; }
.page {
  min-height: 100vh;
}
.sections {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
  padding: 16px;
}
.rig-section {
  display: grid;
  grid-template-columns: 1fr;
  grid-template-rows: 132px 1fr;
  gap: 14px;
  min-height: 0;
}
.panel, .scene {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  box-shadow: 0 12px 28px var(--shadow);
}
.panel {
  height: 132px;
  padding: 14px;
  overflow: hidden;
}
.controls {
  display: grid;
  grid-template-columns: minmax(136px, .78fr) minmax(0, 1.6fr) minmax(104px, .54fr);
  gap: 10px;
  align-items: start;
}
.control-heading {
  grid-column: 1;
  grid-row: 1 / span 2;
  min-width: 0;
}
.section-title {
  margin: 0;
  font-size: 21px;
  line-height: 1.1;
  font-weight: 850;
}
.section-subtitle {
  margin: 6px 0 0;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.42;
}
.select-stack {
  display: grid;
  gap: 8px;
  grid-column: 2;
  grid-row: 1;
}
.control {
  display: grid;
  gap: 7px;
  margin: 0;
}
.control[hidden] { display: none; }
label, legend {
  color: var(--muted);
  font-size: 11px;
  font-weight: 820;
  text-transform: uppercase;
}
select {
  width: 100%;
  min-height: 36px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: #ffffff;
  color: var(--ink);
  padding: 7px 9px;
}
fieldset {
  border: 0;
  padding: 0;
  margin: 0;
}
.method-list {
  display: grid;
  gap: 8px;
}
.method-list {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}
.methods-block {
  grid-column: 2 / 4;
  grid-row: 2;
}
.chip {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-width: 0;
  min-height: 33px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: #ffffff;
  color: var(--ink);
  cursor: pointer;
  font-size: 11px;
  font-weight: 760;
}
.chip input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}
.chip:has(input:checked) {
  border-color: #8bc2cb;
  background: var(--accent-soft);
  color: #104f5e;
}
.method-chip {
  justify-content: flex-start;
  overflow: hidden;
  padding: 0 8px;
}
.method-name {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  text-transform: none;
  white-space: nowrap;
}
.method-name.ours {
  font-weight: 920;
}
.method-chip.failed {
  cursor: default;
  color: var(--fail);
  background: #fff7f6;
  border-color: #e3c2bf;
}
.method-chip.failed input { display: none; }
.dot {
  width: 9px;
  height: 9px;
  border-radius: 999px;
  border: 1px solid rgba(0,0,0,.22);
  flex: 0 0 9px;
}
.failed-badge {
  flex: 0 0 auto;
  margin-left: 2px;
  color: var(--fail);
  font-size: 9px;
  font-weight: 850;
  text-transform: uppercase;
}
.actions {
  display: flex;
  justify-content: flex-end;
  grid-column: 3;
  grid-row: 1;
  align-self: end;
}
button.action {
  min-width: 96px;
  min-height: 34px;
  border: 1px solid var(--line-strong);
  border-radius: 7px;
  background: #ffffff;
  color: var(--ink);
  cursor: pointer;
  font-size: 12px;
  font-weight: 780;
}
button.primary {
  border-color: #9bcbd3;
  background: #e8f4f6;
  color: #104f5e;
}
.scene {
  position: relative;
  overflow: hidden;
  height: clamp(440px, 52vh, 540px);
  min-height: 440px;
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
  background: #ffffff;
}
.scene-label, .legend {
  position: absolute;
  border: 1px solid rgba(220, 228, 236, .92);
  border-radius: 8px;
  background: rgba(255,255,255,.91);
  box-shadow: 0 8px 20px rgba(18, 28, 38, .08);
}
.scene-label {
  left: 18px;
  top: 16px;
  display: grid;
  gap: 4px;
  padding: 10px 12px;
  pointer-events: none;
}
.scene-label b { font-size: 14px; }
.scene-label span {
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
}
.legend {
  right: 18px;
  top: 16px;
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 8px 12px;
  max-width: min(520px, calc(100% - 36px));
  padding: 9px 11px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 760;
}
.legend span {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
}
.swatch {
  width: 20px;
  height: 3px;
  border-radius: 999px;
  display: inline-block;
}
@media (max-width: 980px) {
  .controls {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .control-heading {
    grid-column: 1 / -1;
  }
  .method-list {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .scene {
    height: 500px;
  }
}
@media (max-width: 980px) {
  .sections {
    grid-template-columns: 1fr;
  }
}
@media (max-width: 820px) {
  .controls {
    grid-template-columns: 1fr;
  }
  .method-list {
    grid-template-columns: 1fr;
  }
  .scene {
    height: 560px;
    min-height: 560px;
  }
}
</style>
</head>
<body>
<main class="page">
  <section class="sections">
    <section class="rig-section" data-rig="hex">
      <aside class="panel controls"></aside>
      <section class="scene">
        <canvas></canvas>
        <div class="scene-label"><b></b><span></span></div>
        <div class="legend">
          <span><i class="swatch" style="background:#d33f35"></i>Camera X</span>
          <span><i class="swatch" style="background:#2f8f55"></i>Camera Y</span>
          <span><i class="swatch" style="background:#2f65d0"></i>Camera Z</span>
          <span data-world-legend><i class="swatch" style="background:#6f737a"></i>World F/L/U</span>
        </div>
      </section>
    </section>
    <section class="rig-section" data-rig="stereo">
      <aside class="panel controls"></aside>
      <section class="scene">
        <canvas></canvas>
        <div class="scene-label"><b></b><span></span></div>
        <div class="legend">
          <span><i class="swatch" style="background:#d33f35"></i>Camera X</span>
          <span><i class="swatch" style="background:#2f8f55"></i>Camera Y</span>
          <span><i class="swatch" style="background:#2f65d0"></i>Camera Z</span>
          <span data-world-legend><i class="swatch" style="background:#6f737a"></i>World F/L/U</span>
        </div>
      </section>
    </section>
  </section>
</main>

  };
}

    const extent = Math.ceil(radius / step + 1) * step;
    for (let value = -extent; value <= extent + 1e-9; value += step) {
      this.drawLine(project, [-extent, value, 0], [extent, value, 0], '#dfe6ed', 1, 0.72);
      this.drawLine(project, [value, -extent, 0], [value, extent, 0], '#dfe6ed', 1, 0.72);
    }
  }

  drawWorldAxes(project, radius) {
    const len = Math.max(0.035, radius * 0.5);
    this.drawArrow(project, [0,0,0], [len,0,0], '#6f737a', 2.5, 'F');
    this.drawArrow(project, [0,0,0], [0,len,0], '#6f737a', 2.5, 'L');
    this.drawArrow(project, [0,0,0], [0,0,len], '#6f737a', 2.5, 'U');
    this.drawCircle(project, [0,0,0], 4, '#171a1f', 0.75);
  }

  drawFrustum(project, camera, color, size) {
    const c = camera.position;
    const xDown = camera.axes.X, yRight = camera.axes.Y, zForward = camera.axes.Z;
    const center = vadd(c, vmul(zForward, size * 0.62));
    const corners = [
      vadd(vadd(center, vmul(yRight, size * 0.74)), vmul(xDown, size * 0.52)),
      vadd(vadd(center, vmul(yRight, -size * 0.74)), vmul(xDown, size * 0.52)),
      vadd(vadd(center, vmul(yRight, -size * 0.74)), vmul(xDown, -size * 0.52)),
      vadd(vadd(center, vmul(yRight, size * 0.74)), vmul(xDown, -size * 0.52)),
    ];
    for (let i = 0; i < corners.length; i++) {
      this.drawLine(project, c, corners[i], color, 1.25, 0.76);
      this.drawLine(project, corners[i], corners[(i + 1) % corners.length], color, 1.25, 0.76);
    }
  }

  drawGroups(groups, project) {
    const radius = this.boundsFor(groups);
    const axisLen = Math.max(0.018, Math.min(0.058, radius * 0.25));
    const items = [];
    groups.forEach(group => {
      const lookup = Object.fromEntries(group.cameras.map(camera => [camera.camera, camera]));
      if (this.state.showLinks) {
        cameraEdges(group).forEach(edge => {
          const a = lookup[edge[0]], b = lookup[edge[1]];
          if (!a || !b) return;
          const z = (project(a.position).z + project(b.position).z) / 2;
          items.push({ z, draw: () => {
            this.drawLine(project, a.position, b.position, group.method_color, 4.8, 0.70);
            this.drawDistanceLabel(project, a.position, b.position, group.method_color);
          }});
        });
      }
      group.cameras.forEach(camera => {
        const z = project(camera.position).z;
        items.push({ z, draw: () => {
          if (this.state.showFrustum) this.drawFrustum(project, camera, group.method_color, axisLen * 1.1);
          if (this.state.showAxes) {
            this.drawArrow(project, camera.position, vadd(camera.position, vmul(camera.axes.X, axisLen)), '#d33f35', 2.2, 'X');
            this.drawArrow(project, camera.position, vadd(camera.position, vmul(camera.axes.Y, axisLen)), '#2f8f55', 2.2, 'Y');
            this.drawArrow(project, camera.position, vadd(camera.position, vmul(camera.axes.Z, axisLen)), '#2f65d0', 2.2, 'Z');
          }
          this.drawCircle(project, camera.position, 5.2, group.method_color, 0.97);
          if (this.state.showLabels) {
            const p = project(camera.position);
            this.ctx.save();
            this.ctx.font = '800 12px system-ui, sans-serif';
            this.ctx.fillStyle = '#171a1f';
            this.ctx.fillText(camera.camera, p.x + 8, p.y - 8);
            this.ctx.restore();
          }
        }});
      });
    });
    items.sort((a, b) => a.z - b.z).forEach(item => item.draw());
  }

  baselineStats(groups) {
    const distances = [];
    groups.forEach(group => {
      const lookup = Object.fromEntries(group.cameras.map(camera => [camera.camera, camera]));
      cameraEdges(group).forEach(([aName, bName]) => {
        const a = lookup[aName], b = lookup[bName];
        if (a && b) distances.push(distanceMm(a.position, b.position));
      });
    });
    if (!distances.length) return null;
    return {
      count: distances.length,
      min: Math.min(...distances),
      max: Math.max(...distances),
      mean: distances.reduce((sum, value) => sum + value, 0) / distances.length,
    };
  }

  updateReadout(groups) {
    const selectedLabels = [...this.state.selectedMethods]
      .filter(method => this.hasMethod(method))
      .map(method => methodMeta(method, this.dataset).label);
    const title = `${RIG_LABELS[this.dataset]} ${this.state.layoutKind}`;
    this.sceneTitle.textContent = title;
    this.sceneSubtitle.textContent = selectedLabels.join(', ') || 'No method selected';
  }

  draw() {
    this.resizeCanvas();
    const rect = this.canvas.getBoundingClientRect();
    this.ctx.clearRect(0, 0, rect.width, rect.height);
    this.ctx.fillStyle = '#ffffff';
    this.ctx.fillRect(0, 0, rect.width, rect.height);
    const groups = this.selectedGroups();
    const project = this.projector(groups);
    const radius = this.boundsFor(groups);
    if (this.state.showWorld) {
      this.drawGrid(project, radius);
      this.drawWorldAxes(project, radius);
    }
    this.worldLegend.hidden = !this.state.showWorld;
    this.drawGroups(groups, project);
    this.updateReadout(groups);
  }
}

const views = [
  new RigView(document.querySelector('[data-rig="hex"]'), 'hex'),
  new RigView(document.querySelector('[data-rig="stereo"]'), 'stereo'),
];

window.addEventListener('resize', () => views.forEach(view => view.draw()));
views.forEach(view => view.draw());
</script>
</body>
</html>
